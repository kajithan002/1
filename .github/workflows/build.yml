name: Build WaThemer APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract WaThemer source archive
        run: |
          test -f wathemer-video-wallpaper-source.zip
          mkdir -p source
          unzip -q wathemer-video-wallpaper-source.zip -d source
          test -f source/wathemer-main/gradlew

      - name: Build debug APK
        working-directory: source/wathemer-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wathemer-video-wallpaper-debug-apk
          path: source/wathemer-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
